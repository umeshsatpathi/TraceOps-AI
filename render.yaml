services:
  - type: web
    name: traceops-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        value: 6379
      - key: FALKORDB_GRAPH
        value: traceshield
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_SSL
        value: true
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: CORS_ORIGINS
        sync: false
